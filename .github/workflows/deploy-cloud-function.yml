name: Deploy Cloud Function

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-cloud-function.yml'
  workflow_dispatch:

# Prevents multiple deployments from running at the same time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Cloud Function
        id: deploy
        run: |
          gcloud functions deploy roast_me \
            --gen2 \
            --runtime python314 \
            --trigger-http \
            --allow-unauthenticated \
            --entry-point roast_image \
            --source functions/ \
            --region us-central1 \
            --memory 2GB \
            --timeout 540 \
            --set-env-vars GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},ENABLE_AUDIO_TEST=false \
            --project fun-series-gcloud \
            --quiet

      - name: Display Function URL
        run: |
          # Gen 2 URL extraction path is slightly different
          URL=$(gcloud functions describe roast_me --region us-central1 --format='value(url)')
          echo "✅ Deployed successfully!"
          echo "Function URL: $URL"