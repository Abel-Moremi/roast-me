name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'app.vue'
      - 'components/**'
      - 'pages/**'
      - 'nuxt.config.ts'
      - 'package.json'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Nuxt app
        run: npm run generate
        env:
          ENABLE_AUDIO_TEST: 'false'
          VITE_ROAST_API_URL: ${{ secrets.ROAST_API_URL }}
      
      - name: Validate environment configuration
        run: |
          if [ -z "${{ secrets.ROAST_API_URL }}" ]; then
            echo "⚠️  WARNING: ROAST_API_URL secret is not set!"
            echo "The application will fall back to mock data."
            echo "To use the real API, set the ROAST_API_URL secret to your Cloud Function URL."
          else
            echo "✅ ROAST_API_URL is configured"
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: fun-series-gcloud
          channelId: live

      - name: Display deployment info
        run: |
          echo "✅ Firebase Hosting deployment complete!"
          echo "Project: fun-series-gcloud"
